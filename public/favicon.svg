<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Fond arrondi avec transparence -->
  <rect x="5" y="5" width="120" height="120" rx="20" fill="white" stroke="url(#grad)" stroke-width="3" filter="url(#shadow)"/>

  <!-- Lettres AMH en gras avec dégradé -->
  <text x="50" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="900" fill="url(#grad)" text-anchor="middle" letter-spacing="2">
    AMH
  </text>
</svg>